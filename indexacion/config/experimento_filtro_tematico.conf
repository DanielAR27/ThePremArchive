# EXPERIMENTO (no es una de las políticas A-F ni se entrega): igual que B pero ignorando los
# documentos con topic_hits < 8 (palabras clave del dominio contadas por la araña).
# Única diferencia con B: tema_min_hits.
#
# Resultado: en una muestra de 3000 documentos el índice bajó de 4.6 MB a 3.7 MB (-20 %), pero el
# filtro se equivoca en ambas direcciones: descarta fútbol legítimo (artículos cortos de un solo
# partido o fichaje) y deja pasar artículos que no son de fútbol. topic_hits es una señal demasiado
# tosca para decidir qué indexar, por eso se descartó como política.
# Las rutas son relativas a la ubicación de este archivo.

[entrada]
repo = ../../repo
base_datos = ../../data/crawl.db
tema_min_hits = 8

[normalizacion]
minusculas = true
apostrofes = posesivo
quitar_acentos = true
stopwords = datos/stopwords.txt
reduccion = ninguna
sinonimos =
normalizar_fechas = true
formato_fecha = YYYY-MM-DD
normalizar_numeros = true
nombres = ninguno

[indice]
salida = ../../indices/experimento_filtro_tematico.idx
docs_por_bloque = 2000
procesos = 0
compresion_postings = varint
