# Política E — variante de análisis: igual que C, pero con stemming (Porter) en vez de lematización.
# Única diferencia con C: la clave "reduccion". Permite comparar ambas técnicas de forma aislada.

# Las rutas son relativas a la ubicación de este archivo.

[entrada]
repo = ../../repo
base_datos = ../../data/crawl.db
depuracion = true
reglas_depuracion = datos/depuracion.txt

[normalizacion]
minusculas = true
apostrofes = posesivo
quitar_acentos = true
stopwords = datos/stopwords.txt
reduccion = stemming
algoritmo_stemming = porter
sinonimos = datos/sinonimos.txt
normalizar_fechas = true
formato_fecha = YYYY-MM-DD
normalizar_numeros = true
nombres = entidad
entidades = datos/entidades.txt

[indice]
salida = ../../indices/manual_E.idx
docs_por_bloque = 2000
procesos = 0
compresion_postings = varint
