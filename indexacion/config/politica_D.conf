# Política D — variante de análisis: A + solo stopwords.
# Única diferencia con A: la clave "stopwords". Mide el efecto de las stopwords sobre el
# tamaño del índice y el tiempo de indexación.

# Las rutas son relativas a la ubicación de este archivo.

[entrada]
repo = ../../repo
base_datos = ../../data/crawl.db
depuracion = true
reglas_depuracion = datos/depuracion.txt

[normalizacion]
minusculas = true
apostrofes = separar
quitar_acentos = false
stopwords = datos/stopwords.txt
reduccion = ninguna
sinonimos =
normalizar_fechas = false
normalizar_numeros = false
nombres = ninguno

[indice]
salida = ../../indices/manual_D.idx
docs_por_bloque = 2000
procesos = 0
compresion_postings = varint
