# Política A — mínima: solo tokenización y minúsculas.
# Línea base para medir el efecto de las demás políticas.
#
# Claves de [normalizacion]:
#   apostrofes       separar | posesivo   ("arsenal's" -> "arsenal" + "s"  |  "arsenal")
#   reduccion        ninguna | lematizar | stemming
#   nombres          ninguno | entidad    (entidad = nombres propios consecutivos como un solo término)
#   formato_fecha    formato destino si normalizar_fechas = true

# Las rutas son relativas a la ubicación de este archivo.

[entrada]
repo = ../../repo
base_datos = ../../data/crawl.db
depuracion = true
reglas_depuracion = datos/depuracion.txt

[normalizacion]
minusculas = true
apostrofes = separar
quitar_acentos = false
stopwords =
reduccion = ninguna
sinonimos =
normalizar_fechas = false
normalizar_numeros = false
nombres = ninguno

[indice]
salida = ../../indices/manual_A.idx
docs_por_bloque = 2000
procesos = 0
compresion_postings = varint
