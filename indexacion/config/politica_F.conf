# Política F — variante de análisis: B + sinónimos de dominio.
# Única diferencia con B: la clave "sinonimos". Permite ver si los sinónimos ayudan o meten ruido
# sin mezclarlos con lematización ni nombres.

# Las rutas son relativas a la ubicación de este archivo.

[entrada]
repo = ../../repo
base_datos = ../../data/crawl.db
depuracion = true
reglas_depuracion = datos/depuracion.txt

[normalizacion]
minusculas = true
apostrofes = posesivo
quitar_acentos = true
stopwords = datos/stopwords.txt
reduccion = ninguna
sinonimos = datos/sinonimos.txt
normalizar_fechas = true
formato_fecha = YYYY-MM-DD
normalizar_numeros = true
nombres = ninguno

[indice]
salida = ../../indices/manual_F.idx
docs_por_bloque = 2000
procesos = 0
compresion_postings = varint
