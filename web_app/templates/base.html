<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}The Prem Archive{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icono.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block cabeza %}{% endblock %}
</head>
<body class="{% block clase %}{% endblock %}">
  <header class="barra">
    <a class="marca" href="/">
      <svg class="marca-icono" viewBox="0 0 56 40" width="42" height="30" fill="none" aria-hidden="true">
        <circle cx="12" cy="27" r="8.2" fill="var(--superficie)" stroke="var(--acento-fuerte)" stroke-width="1.8"/>
        <polygon points="12,23.1 15.6,25.7 14.2,29.9 9.8,29.9 8.4,25.7" fill="var(--acento-fuerte)"/>
        <path d="M12 23.1V19M15.6 25.7l3.9-1.2M14.2 29.9l2.4 3.4M9.8 29.9l-2.4 3.4M8.4 25.7l-3.9-1.2"
              stroke="var(--acento-fuerte)" stroke-width="1.4" stroke-linecap="round"/>
        <g stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M29 19.5L23.5 9L14.5 9.5"/>
          <path d="M27.8 21L21 13.5L13 15"/>
          <path d="M27.2 22.8L21 19L16 19.8"/>
          <path d="M28.5 25L25 31L22.5 35.5"/>
          <path d="M31.5 25.5L31 31.5L32 35.5"/>
          <path d="M34 25L36.5 31.5L38.5 35.5"/>
          <path d="M35.5 18.5L43 11L49.5 17.5L52 24"/>
          <path d="M34.5 20L39 14.5L46 25.5L48.5 33.5"/>
        </g>
        <ellipse cx="41" cy="21" rx="8.2" ry="6.2" transform="rotate(-12 41 21)" fill="currentColor"/>
        <ellipse cx="30" cy="22.2" rx="5" ry="4.3" fill="currentColor"/>
        <path d="M25.5 22.8Q23.5 23.4 24.2 25" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span>The Prem Archive</span>
    </a>
    <nav>
      <a href="/" class="{{ 'activo' if request.path in ('/', '/search') }}">Search</a>
      <a href="/evaluate" class="{{ 'activo' if request.path.startswith('/evaluate') }}">Rate results</a>
      <a href="/metrics" class="{{ 'activo' if request.path.startswith('/metrics') }}">Metrics</a>
    </nav>
  </header>
  <main>{% block contenido %}{% endblock %}</main>
</body>
</html>
